<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crea per strumento · Archivio spartiti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&family=Piazzolla:wght@500;700&family=Space+Mono&display=swap">
<style>
:root{--navy:#1E1937;--orange:#EF7135;--green:#008367;--wine:#620E1C;--cream:#F6E1C9;--gold:#F0BC0F;--sage:#7EA681;--sky:#BBDEF5;--ink:#1C1C1F}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 Karla,sans-serif}
h1,h2{font-family:Piazzolla,serif;margin:0;font-weight:700;color:var(--navy)}
h1{font-size:clamp(2rem,5vw,3rem);color:var(--cream);line-height:1.1}
h2{font-size:1.5rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem clamp(1rem,4vw,3rem);background:#fff;border-bottom:4px solid var(--orange)}
.logo{display:block;height:48px;width:auto;max-width:100%}
.acc{display:flex;align-items:center;gap:.75rem}
.nav{display:flex;gap:.25rem 1.25rem;flex-wrap:wrap}
.nav a{white-space:nowrap;color:var(--navy);font-weight:600;text-decoration:none;padding:.25rem 0;border-bottom:3px solid transparent}
.nav a[aria-current]{border-bottom-color:var(--orange)}
.nav a:hover{border-bottom-color:var(--sage)}
#st{padding:.2rem .7rem;border-radius:999px;background:var(--sky);color:var(--navy);font-family:'Space Mono',monospace;font-size:.85rem}
#st.on{background:var(--green);color:#fff}
.band{background:var(--navy);padding:2rem clamp(1rem,4vw,3rem) 2.25rem}
.band p{margin:.4rem 0 0;color:var(--cream);font-size:1.1rem}
main{padding:1.5rem clamp(1rem,4vw,3rem) 3rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
section{background:#fff;border-radius:12px;padding:1.25rem;border-top:6px solid var(--navy)}
section.lib{border-top-color:var(--orange)}
.sub{margin:.1rem 0 .9rem;font-family:'Space Mono',monospace;font-size:.85rem}
label{font-weight:600;color:var(--navy)}
input,select,button{font:inherit;color:inherit}
input[type=text],select{padding:.5rem .6rem;border:1px solid var(--navy);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button{cursor:pointer;border:2px solid var(--navy);background:#fff;color:var(--navy);padding:.5rem 1rem;border-radius:999px;font-weight:600}
button:hover:not(:disabled){background:var(--sky)}
button.main{background:var(--orange);border-color:var(--orange)}
button.main:hover:not(:disabled){background:var(--gold);border-color:var(--gold)}
button:disabled{background:var(--cream);border-color:var(--cream);cursor:not-allowed}
[hidden]{display:none!important}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
.bar input[type=text]{flex:1;min-width:12rem}
.mode{display:flex;gap:1.25rem;flex-wrap:wrap;margin:.6rem 0}
.mode label{font-weight:400;color:var(--ink)}
hr{border:0;border-top:1px solid var(--sage);margin:1rem 0}
ol{list-style:none;margin:.5rem 0;padding:0}
li{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-top:1px solid var(--sage)}
li .t{flex:1}
li small,.mono,pre{font-family:'Space Mono',monospace;font-size:.85rem}
li small{margin-left:.5rem}
.act button{padding:.15rem .6rem;border-width:1px;margin-left:.25rem}
.hint{font-size:.9rem;margin:.25rem 0 .75rem}
.warn{color:var(--wine);font-weight:600}
pre{white-space:pre-wrap;margin:.75rem 0 0}
a.dl{display:inline-block;margin-top:.75rem;font-weight:600;color:var(--navy)}
</style>
</head>
<body>
<header>
  <a href="https://www.corpomusicalegverdi.it/"><img class="logo" src="https://www.corpomusicalegverdi.it/wp-content/uploads/2026/01/Marchio-Ufficiale-Orizzontale.svg" alt="Corpo Musicale “G. Verdi” di Venaria Reale"></a>
  <nav class="nav"><a href="archivio.html">Archivio</a><a href="divisione.html">Aggiungi brano</a><a href="stampa.html">Stampa brano</a><a href="cartellina.html" aria-current="page">Crea per strumento</a><a href="organico.html">Organico</a><a href="ordine.html">Ordine parti</a><a href="sistema.html">Controllo</a></nav>
  <div class="acc"><span id="st">Non connesso</span><button id="login">Accedi con Google</button></div>
</header>
<div class="band"><h1>Crea per strumento</h1><p>Le parti di un nuovo strumentista, brano per brano</p></div>

<main>
  <div class="cols">
    <section id="p-c"></section>
    <section id="p-l" class="lib"></section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="regole.js?v=13"></script>
<script>
const CFG = {
  CLIENT_ID: '461215269916-tcd8cfsa5m951ohohibf4f8635tdgolp.apps.googleusercontent.com',
  FOLDERS: {concerto: '1wWMSp-kyX2K6Kk1hJfuv3gISgkoQBX4V', marce: '1M0-uSG4jsO-P6SG-MY1MoNd_aAppM8Dp'}
};
const LBL = {concerto: 'Brani da concerto', marce: 'Marce'};
// La cartellina è per i concerti (brani da concerto, a volte qualche marcia); il libretto è per le sfilate (solo marce)
const PANELS = [
  {k: 'c', title: 'Cartellina', sub: 'per i concerti · organico da concerto', file: 'cartellina.json', org: 'concerto', allow: ['concerto', 'marce']},
  {k: 'l', title: 'Libretto', sub: 'per le sfilate · organico da sfilata', file: 'libretto.json', org: 'marce', allow: ['marce']}
];
const $ = s => document.querySelector(s), low = s => s.toLowerCase().trim();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s.replace(/\b\w/g, c => c.toUpperCase());
const API = 'https://www.googleapis.com/drive/v3/files?supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=allDrives';
let tok, brani = [], dup = {};

// ---- Accesso (la sessione è condivisa con le altre pagine) ----
const SS = {
  get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { sessionStorage.removeItem(k); } catch (e) {} }
};
function connected(name) { $('#st').textContent = name ? 'Ciao ' + name : 'Connesso'; $('#st').className = 'on'; $('#login').hidden = true; start(); }
function expired() { tok = null; SS.del('sess'); $('#st').textContent = 'Sessione scaduta'; $('#st').className = ''; $('#login').hidden = false; }
$('#login').onclick = () => {
  if (!window.google) { $('#st').textContent = 'Servizio Google non raggiungibile'; return; }
  google.accounts.oauth2.initTokenClient({
    client_id: CFG.CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive openid profile', hd: 'corpomusicalegverdi.it',
    callback: async r => {
      if (!r.access_token) return;
      tok = r.access_token; let name = '';
      try { const u = await g('https://www.googleapis.com/oauth2/v3/userinfo'); name = u.given_name || u.name || ''; } catch (e) {}
      SS.set('sess', JSON.stringify({t: tok, n: name, e: Date.now() + ((Number(r.expires_in) || 3600) - 120) * 1000}));
      connected(name);
    }
  }).requestAccessToken();
};
async function raw(url, opt = {}) {
  const r = await Regole.fetchRetry(url, {...opt, headers: {...(opt.headers || {}), Authorization: 'Bearer ' + tok}});
  if (r.status === 401) { expired(); throw new Error('Sessione scaduta: accedi di nuovo con Google.'); }
  if (!r.ok) throw new Error(await r.text());
  return r;
}
const g = async (u, o) => (await raw(u, o)).json();
const gb = async u => (await raw(u)).arrayBuffer();
try { const s0 = JSON.parse(SS.get('sess')); if (s0 && s0.e > Date.now()) { tok = s0.t; window.addEventListener('load', () => connected(s0.n)); } } catch (e) {}

// ---- File di configurazione sul Drive (con copia di sicurezza su GitHub in dati/) ----
const CF = {}; let parent;
async function parentId() {
  if (!parent) parent = (await g(`https://www.googleapis.com/drive/v3/files/${CFG.FOLDERS.concerto}?fields=parents&supportsAllDrives=true`)).parents[0];
  return parent;
}
async function backup(name) { try { const x = await fetch('dati/' + name); if (x.ok) return await x.json(); } catch (e) {} return null; }
async function loadCfg(name) {
  const q = `'${await parentId()}' in parents and name='${name}' and trashed=false`;
  const r = await g(`${API}&fields=files(id)&q=${encodeURIComponent(q)}`);
  if (!r.files.length) return backup(name);
  CF[name] = r.files[0].id;
  return g(`https://www.googleapis.com/drive/v3/files/${CF[name]}?alt=media&supportsAllDrives=true`);
}
async function saveCfg(name, obj) {
  const body = JSON.stringify(obj);
  if (CF[name]) return g(`https://www.googleapis.com/upload/drive/v3/files/${CF[name]}?uploadType=media&supportsAllDrives=true`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body});
  const f = new FormData();
  f.append('metadata', new Blob([JSON.stringify({name, parents: [await parentId()]})], {type: 'application/json'}));
  f.append('file', new Blob([body], {type: 'application/json'}));
  CF[name] = (await g('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id', {method: 'POST', body: f})).id;
}

// ---- Brani e parti ----
const bf = id => brani.find(b => b.id === id);
const lab = b => dup[low(b.name)] > 1 ? `${b.name} — ${LBL[b.k]}` : b.name;
async function partsOf(b) {
  const q = `'${b.id}' in parents and trashed=false`;
  const r = await g(`${API}&pageSize=200&orderBy=name&fields=files(id,name)&q=${encodeURIComponent(q)}`);
  return r.files.map(f => ({id: f.id, ...Regole.parseFile(f.name, b.name)})).filter(p => p.kind === 'part').map(p => ({id: p.id, num: p.num, name: p.name}));
}
// Due parti A5 per foglio A4, nell'ordine in cui arrivano
function sheets(out, cells) {
  for (let i = 0; i < cells.length; i += 2) {
    const land = cells[i].height >= cells[i].width, W = land ? 841.89 : 595.28, H = land ? 595.28 : 841.89;
    const pg = out.addPage([W, H]), cw = land ? W / 2 : W, ch = land ? H : H / 2;
    [cells[i], cells[i + 1]].forEach((e, j) => {
      if (!e) return;
      const s = Math.min(cw / e.width, ch / e.height), w = e.width * s, h = e.height * s;
      pg.drawPage(e, {x: land ? j * cw + (cw - w) / 2 : (cw - w) / 2, y: land ? (ch - h) / 2 : (j === 0 ? ch : 0) + (ch - h) / 2, width: w, height: h});
    });
  }
}

// ---- Un pannello (cartellina o libretto): elenco salvato + PDF per strumento ----
function setup(p) {
  const k = p.k, e = id => $(`#${k}-${id}`);
  p.cart = [];
  $(`#p-${k}`).innerHTML = `<h2>${p.title}</h2><p class="sub">${p.sub}</p>
    <div class="bar"><input id="${k}-bq" type="text" list="${k}-dl" placeholder="Titolo del brano" aria-label="Titolo del brano"><button id="${k}-add" disabled>Aggiungi</button></div>
    <datalist id="${k}-dl"></datalist>
    <p id="${k}-msg" class="hint">Accedi con Google per iniziare.</p>
    <ol id="${k}-cl"></ol>
    <hr>
    <div class="bar"><label for="${k}-rl">Strumento</label><select id="${k}-rl"></select></div>
    <div id="${k}-ppw" class="bar" hidden><label for="${k}-pp">Parte, se il brano ha parti separate</label><select id="${k}-pp"><option value="1">Parte 1</option><option value="2">Parte 2</option><option value="3">Parte 3</option></select></div>
    <div id="${k}-lay" class="mode" hidden><span>Marce, su ogni foglio:</span>
      <label><input type="radio" name="${k}-l" value="1" checked> 1 parte</label>
      <label><input type="radio" name="${k}-l" value="2"> 2 parti A5 su un foglio A4</label></div>
    <p><button id="${k}-go" class="main" disabled>Prepara il PDF</button></p>
    <pre id="${k}-log"></pre><div id="${k}-link"></div>`;
  const msg = (t, warn) => { e('msg').textContent = t; e('msg').className = 'hint' + (warn ? ' warn' : ''); };
  const allowed = () => brani.filter(b => p.allow.includes(b.k));
  const persist = async () => {
    try { await saveCfg(p.file, p.cart.map(c => ({id: c.id, name: c.name, k: c.k}))); msg(`${p.title} salvata per tutta la banda.`); }
    catch (err) { msg('Non sono riuscito a salvare: ' + err.message, true); }
  };
  p.render = () => {
    e('cl').innerHTML = p.cart.map((c, i) => {
      const b = bf(c.id);
      return `<li><span class="t">${i + 1}. ${b ? esc(b.name) : esc(c.name) + ' (non trovato nel Drive)'}<small>${LBL[(b || c).k] || ''}</small></span>
        <span class="act"><button type="button" data-a="up" data-i="${i}" aria-label="Sposta su">↑</button><button type="button" data-a="dn" data-i="${i}" aria-label="Sposta giù">↓</button><button type="button" data-a="rm" data-i="${i}">Togli</button></span></li>`;
    }).join('');
    const role = e('rl').value;
    e('ppw').hidden = !(role && !Regole.parsePart(role).roles.length);
    e('lay').hidden = !p.cart.some(c => (bf(c.id) || c).k === 'marce');
    e('go').disabled = !(tok && p.cart.length && role);
  };
  p.init = (org, saved) => {
    p.cart = Array.isArray(saved) ? saved.filter(c => p.allow.includes(c.k)) : [];
    e('dl').innerHTML = allowed().map(b => `<option value="${esc(lab(b))}">`).join('');
    e('rl').innerHTML = [...new Set(Regole.parseOrg(org[p.org] || '').map(o => o.role))].map(r => `<option value="${esc(r)}">${esc(cap(r))}</option>`).join('');
    e('add').disabled = false;
    msg(p.cart.length ? `${p.title} caricata dal Drive.` : `La ${p.title.toLowerCase()} è vuota: aggiungi i brani.`);
    p.render();
  };
  const findB = v => { const x = low(v), l = allowed(); let c = l.filter(b => low(lab(b)) === x); if (!c.length) c = l.filter(b => low(b.name) === x); return c.length === 1 ? c[0] : null; };
  const addBrano = async () => {
    const v = e('bq').value.trim(); if (!v) return;
    const b = findB(v);
    if (!b) { msg(p.allow.length === 1 ? 'Scegli una marcia dall’elenco.' : 'Scegli un brano dall’elenco (se ce ne sono due con lo stesso nome, scegli quello della cartella giusta).'); return; }
    if (p.cart.some(c => c.id === b.id)) { msg('«' + b.name + '» è già nell’elenco.'); return; }
    p.cart.push({id: b.id, name: b.name, k: b.k}); e('bq').value = ''; p.render(); await persist();
  };
  e('add').onclick = addBrano;
  e('bq').onkeydown = ev => { if (ev.key === 'Enter') addBrano(); };
  e('cl').addEventListener('click', async ev => {
    const t = ev.target.closest('button'); if (!t) return;
    const i = +t.dataset.i, a = t.dataset.a, c = p.cart;
    if (a === 'rm') c.splice(i, 1);
    else if (a === 'up' && i > 0) [c[i - 1], c[i]] = [c[i], c[i - 1]];
    else if (a === 'dn' && i < c.length - 1) [c[i + 1], c[i]] = [c[i], c[i + 1]];
    else return;
    p.render(); await persist();
  });
  e('rl').onchange = () => p.render();
  e('go').onclick = async () => {
    const role = e('rl').value, log = m => { e('log').textContent += m + '\n'; };
    const two = !e('lay').hidden && document.querySelector(`input[name=${k}-l]:checked`).value === '2';
    e('go').disabled = true; e('log').textContent = ''; e('link').innerHTML = '';
    try {
      const out = await PDFLib.PDFDocument.create(); let buf = [], found = 0;
      const flush = () => { if (buf.length) { sheets(out, buf); buf = []; } };
      for (const c of p.cart) {
        const b = bf(c.id);
        if (!b) { log(`⚠ «${c.name}»: brano non trovato nel Drive`); continue; }
        const part = Regole.partFor(await partsOf(b), role, e('ppw').hidden ? null : e('pp').value);
        if (!part) { log(`⚠ ${b.name}: nessuna parte per ${cap(role)}`); continue; }
        const d = await PDFLib.PDFDocument.load(await gb(`https://www.googleapis.com/drive/v3/files/${part.id}?alt=media&supportsAllDrives=true`), {ignoreEncryption: true});
        if (two && b.k === 'marce') buf.push(...await out.embedPdf(d, d.getPageIndices()));
        else { flush(); (await out.copyPages(d, d.getPageIndices())).forEach(x => out.addPage(x)); }
        log(`✓ ${b.name}: ${part.name}`); found++;
      }
      flush();
      if (!found) throw new Error('Nessuna parte trovata per questo strumento.');
      const url = URL.createObjectURL(new Blob([await out.save()], {type: 'application/pdf'}));
      e('link').innerHTML = `<a class="dl" href="${url}" target="_blank" rel="noopener">Apri il PDF da stampare (${found} brani, ${out.getPageCount()} pagine)</a>`;
    } catch (err) { log('Errore: ' + err.message); }
    p.render();
  };
  p.msg = msg;
}
PANELS.forEach(setup);

async function start() {
  PANELS.forEach(p => p.msg('Carico i brani…'));
  try {
    const org = (await loadCfg('organico.json')) || Regole.ORG0, saved = [];
    for (const p of PANELS) saved.push(await loadCfg(p.file));
    brani = [];
    for (const k of Object.keys(CFG.FOLDERS)) {
      let pt = '';
      do {
        const q = `'${CFG.FOLDERS[k]}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
        const r = await g(`${API}&pageSize=1000&orderBy=name&fields=nextPageToken,files(id,name)&q=${encodeURIComponent(q)}${pt ? '&pageToken=' + encodeURIComponent(pt) : ''}`);
        r.files.forEach(f => brani.push({...f, k})); pt = r.nextPageToken;
      } while (pt);
    }
    brani.sort((a, b) => a.name.localeCompare(b.name, 'it'));
    brani.forEach(b => { dup[low(b.name)] = (dup[low(b.name)] || 0) + 1; });
    PANELS.forEach((p, i) => p.init(org, saved[i]));
  } catch (err) { PANELS.forEach(p => p.msg('Errore: ' + err.message, true)); }
}
</script>
<p class="ver" id="ver" style="text-align:center;font-family:'Space Mono',monospace;font-size:.75rem;margin:0;padding:1rem 0 2rem">Versione pagina: build F9</p>
<script>document.getElementById('ver').textContent += ' · regole: ' + (window.Regole && Regole.build ? Regole.build : 'vecchie o non caricate');</script>
</body>
</html>
