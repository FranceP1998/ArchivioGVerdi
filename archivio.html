<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archivio · Archivio spartiti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&family=Piazzolla:wght@500;700&family=Space+Mono&display=swap">
<style>
:root{--navy:#1E1937;--orange:#EF7135;--green:#008367;--wine:#620E1C;--cream:#F6E1C9;--gold:#F0BC0F;--sage:#7EA681;--sky:#BBDEF5;--ink:#1C1C1F}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 Karla,sans-serif}
h1,h2{font-family:Piazzolla,serif;margin:0;font-weight:700;color:var(--navy)}
h1{font-size:clamp(2rem,5vw,3rem);color:var(--cream);line-height:1.1}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem clamp(1rem,4vw,3rem);background:#fff;border-bottom:4px solid var(--orange)}
.logo{display:block;height:48px;width:auto;max-width:100%}
.acc{display:flex;align-items:center;gap:.75rem}
.nav{display:flex;gap:1.25rem}
.nav a{color:var(--navy);font-weight:600;text-decoration:none;padding:.25rem 0;border-bottom:3px solid transparent}
.nav a[aria-current]{border-bottom-color:var(--orange)}
.nav a:hover{border-bottom-color:var(--sage)}
#st{padding:.2rem .7rem;border-radius:999px;background:var(--sky);color:var(--navy);font-family:'Space Mono',monospace;font-size:.85rem}
#st.on{background:var(--green);color:#fff}
.band{background:var(--navy);padding:2rem clamp(1rem,4vw,3rem) 2.25rem}
.band p{margin:.4rem 0 0;color:var(--cream);font-size:1.1rem}
main{padding:1.5rem clamp(1rem,4vw,3rem) 3rem;max-width:60rem}
section{background:#fff;border-radius:12px;padding:1.25rem}
input,select,button{font:inherit;color:inherit}
input,select{padding:.5rem .6rem;border:1px solid var(--navy);border-radius:6px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button{cursor:pointer;border:2px solid var(--navy);background:#fff;color:var(--navy);padding:.5rem 1rem;border-radius:999px;font-weight:600}
button:hover{background:var(--sky)}
.bar{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.bar input{flex:1;min-width:12rem}
#msg{font-family:'Space Mono',monospace;font-size:.85rem;margin:0 0 .75rem}
details{border-top:1px solid var(--sage);padding:.55rem 0}
summary{cursor:pointer;font-weight:600;color:var(--navy)}
summary small{font-weight:400;color:var(--ink);margin-left:.5rem;font-family:'Space Mono',monospace;font-size:.8rem}
ol{list-style:none;margin:.5rem 0 .25rem;padding:0 0 0 1rem}
li{padding:.15rem 0}
a{color:var(--navy)}
.bad{color:var(--wine);font-weight:600}
</style>
</head>
<body>
<header>
  <a href="https://www.corpomusicalegverdi.it/"><img class="logo" src="https://www.corpomusicalegverdi.it/wp-content/uploads/2026/01/Marchio-Ufficiale-Orizzontale.svg" alt="Corpo Musicale “G. Verdi” di Venaria Reale"></a>
  <nav class="nav"><a href="archivio.html" aria-current="page">Archivio</a><a href="index.html">Divisione PDF</a></nav>
  <div class="acc"><span id="st">Non connesso</span><button id="login">Accedi con Google</button></div>
</header>
<div class="band"><h1>Archivio</h1><p>Brani da concerto e marce</p></div>

<main>
  <section>
    <div class="bar">
      <input id="q" type="search" placeholder="Cerca un brano" aria-label="Cerca un brano">
      <select id="cat" aria-label="Cartella">
        <option value="">Tutti i brani</option>
        <option value="concerto">Brani da concerto</option>
        <option value="marce">Marce</option>
      </select>
    </div>
    <p id="msg">Accedi con Google per vedere l’archivio.</p>
    <div id="list"></div>
  </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CFG = {
  CLIENT_ID: '461215269916-tcd8cfsa5m951ohohibf4f8635tdgolp.apps.googleusercontent.com',
  FOLDERS: {
    concerto: '1wWMSp-kyX2K6Kk1hJfuv3gISgkoQBX4V',
    marce: '1M0-uSG4jsO-P6SG-MY1MoNd_aAppM8Dp'
  }
};
const LBL = {concerto: 'Brani da concerto', marce: 'Marce'};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const API = 'https://www.googleapis.com/drive/v3/files?supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=allDrives';
let tok, all = [];

// Accesso (condiviso con la pagina Divisione PDF tramite la stessa sessione del browser)
const SS = {
  get: k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { sessionStorage.removeItem(k); } catch (e) {} }
};
function connected(name) {
  $('#st').textContent = name ? 'Ciao ' + name : 'Connesso'; $('#st').className = 'on';
  $('#login').hidden = true; load();
}
function expired() {
  tok = null; SS.del('sess'); $('#st').textContent = 'Sessione scaduta'; $('#st').className = '';
  $('#login').hidden = false;
}
$('#login').onclick = () => {
  if (!window.google) { $('#st').textContent = 'Servizio Google non raggiungibile'; return; }
  let hint; try { hint = localStorage.getItem('hint') || undefined; } catch (e) {}
  google.accounts.oauth2.initTokenClient({
    client_id: CFG.CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive openid profile', hd: 'corpomusicalegverdi.it', login_hint: hint,
    callback: async r => {
      if (!r.access_token) return;
      tok = r.access_token; let name = '';
      try {
        const u = await g('https://www.googleapis.com/oauth2/v3/userinfo');
        name = u.given_name || u.name || '';
        try { localStorage.setItem('hint', u.email); } catch (e) {}
      } catch (e) {}
      SS.set('sess', JSON.stringify({t: tok, n: name, e: Date.now() + ((Number(r.expires_in) || 3600) - 120) * 1000}));
      connected(name);
    }
  }).requestAccessToken();
};
async function g(url, opt = {}) {
  const r = await fetch(url, {...opt, headers: {...(opt.headers || {}), Authorization: 'Bearer ' + tok}});
  if (r.status === 401) { expired(); throw new Error('Sessione scaduta: accedi di nuovo con Google.'); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
try { const s0 = JSON.parse(SS.get('sess')); if (s0 && s0.e > Date.now()) { tok = s0.t; window.addEventListener('load', () => connected(s0.n)); } } catch (e) {}

// Elenco dei brani: una cartella per brano dentro le due cartelle principali
async function load() {
  $('#msg').textContent = 'Carico l’archivio…'; all = [];
  try {
    for (const k of Object.keys(CFG.FOLDERS)) {
      let pt = '';
      do {
        const q = `'${CFG.FOLDERS[k]}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
        const r = await g(`${API}&pageSize=1000&orderBy=name&fields=nextPageToken,files(id,name)&q=${encodeURIComponent(q)}${pt ? '&pageToken=' + encodeURIComponent(pt) : ''}`);
        r.files.forEach(f => all.push({...f, k}));
        pt = r.nextPageToken;
      } while (pt);
    }
    all.sort((a, b) => a.name.localeCompare(b.name, 'it'));
    render();
  } catch (e) { $('#msg').textContent = 'Errore: ' + e.message; $('#msg').className = 'bad'; }
}
function render() {
  const t = norm($('#q').value.trim()), c = $('#cat').value;
  const l = all.filter(b => (!c || b.k === c) && norm(b.name).includes(t));
  $('#msg').className = ''; $('#msg').textContent = l.length === 1 ? '1 brano' : l.length + ' brani';
  $('#list').innerHTML = l.map(b => `<details data-id="${b.id}"><summary>${esc(b.name)}<small>${LBL[b.k]}</small></summary><ol><li>Carico…</li></ol></details>`).join('');
}
$('#q').oninput = render; $('#cat').onchange = render;

// Parti di un brano: si caricano all'apertura
$('#list').addEventListener('toggle', async e => {
  const d = e.target; if (!d.open || d.dataset.done) return;
  d.dataset.done = 1; const ol = d.querySelector('ol');
  try {
    const q = `'${d.dataset.id}' in parents and trashed=false`;
    const r = await g(`${API}&pageSize=200&orderBy=name&fields=files(id,name,webViewLink)&q=${encodeURIComponent(q)}`);
    ol.innerHTML = r.files.map(f => `<li><a href="${f.webViewLink}" target="_blank" rel="noopener">${esc(f.name.replace(/\.pdf$/i, ''))}</a></li>`).join('') || '<li>Cartella vuota</li>';
  } catch (err) { ol.innerHTML = `<li class="bad">${esc(err.message)}</li>`; d.dataset.done = ''; }
}, true);
</script>
</body>
</html>
